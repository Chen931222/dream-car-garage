<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#0a0b0d;
    --accent:#d4af37;           /* 依當前車款切換 */
    --text:#ece9e2;
    --dim:#8d8a82;
  }
  html,body{ height:100%; overflow:hidden; overscroll-behavior:none; }
  body{
    background:var(--bg); color:var(--text);
    font-family:"Noto Sans TC",-apple-system,"Segoe UI",sans-serif; font-weight:300;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== 舞台背景 ===== */
  #stage{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 95% 52% at 50% 82%, var(--glow, rgba(212,175,55,.12)), transparent 62%),
      radial-gradient(ellipse 130% 95% at 50% 38%, var(--stage-mid, #15161a), var(--bg) 78%);
  }
  #stage .haze{ position:absolute; inset:0;
    background:radial-gradient(ellipse 60% 30% at 50% 88%, rgba(255,255,255,.045), transparent 70%); }

  /* ===== 3D 車（3 格輪替池） ===== */
  .car-viewer{
    position:fixed; inset:0; z-index:1; opacity:0; pointer-events:none;
    will-change:opacity, transform;
  }
  /* 影格邊緣用遮罩融進黑底：左右各留一段漸層，往旁邊挪也不會露出圖框 */
  .car-viewer canvas{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 56%;
    -webkit-mask-image:radial-gradient(ellipse closest-side at 50% 56%, #000 58%, transparent 100%);
            mask-image:radial-gradient(ellipse closest-side at 50% 56%, #000 58%, transparent 100%); }
  body.dragging{ cursor:grabbing; }

  /* ===== 進度條（車輛進度） ===== */
  #progress-bar{
    position:fixed; top:0; left:0; width:100%; height:2px; z-index:40;
    height:1px; background:var(--accent);
    transform-origin:left center; transform:scaleX(0);
    transition:transform .8s cubic-bezier(.22,1,.36,1);
  }

  /* ===== 頂欄 ===== */
  #topbar{
    position:fixed; top:0; left:0; right:0; z-index:30;
    display:flex; justify-content:space-between; align-items:center;
    padding:20px 30px; pointer-events:none;
  }
  #topbar .brand{ font-size:13px; letter-spacing:.04em; color:var(--text); display:flex; align-items:center; gap:8px; }
  #topbar .brand b{ font-family:"Noto Serif TC",Georgia,serif; font-weight:500; font-size:16px; letter-spacing:.06em; }
  #topbar .tools{ display:flex; gap:8px; }
  #topbar .tools > *{
    pointer-events:auto; font-family:inherit; font-size:14px; font-weight:400; letter-spacing:.02em; text-decoration:none;
    color:var(--text); border:none; border-bottom:1px solid transparent; border-radius:0;
    min-height:40px; padding:0 4px; background:none; display:inline-flex; align-items:center; gap:6px;
    cursor:pointer; transition:border-color .2s, color .2s;
  }
  #topbar .tools{ gap:22px; }
  #topbar .tools > *:hover{ border-bottom-color:var(--accent); }
  #btn-auto.on, #btn-snd.on{ color:var(--accent); }
  /* Lucide 內嵌 icon（取代 emoji） */
  svg.lic{ width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2;
    stroke-linecap:round; stroke-linejoin:round; vertical-align:-2px; }

  /* ===== 右側車輛縮圖導覽（手機縮成圓點） ===== */
  #dots{
    position:fixed; right:14px; top:50%; transform:translateY(-50%);
    z-index:30; display:flex; flex-direction:column; gap:10px;
  }
  #dots button{
    width:56px; height:32px; border-radius:6px; cursor:pointer;
    border:1px solid rgba(255,255,255,.16); background:rgba(20,21,26,.7);
    padding:0; position:relative; transition:.25s; opacity:.55;
    display:flex; align-items:center; justify-content:center;
  }
  #dots button img{ width:100%; height:100%; object-fit:cover; border-radius:5px; display:block; pointer-events:none; }
  #dots button .ic{ font-style:normal; font-size:15px; line-height:1; }
  #dots button:hover{ opacity:.9; }
  #dots button.active{
    opacity:1; border-color:var(--accent);
  }
  #dots button .lb{
    position:absolute; right:calc(100% + 10px); top:50%; transform:translateY(-50%);
    font-size:11px; letter-spacing:.1em; color:#c9c5bc; white-space:nowrap;
    background:rgba(10,11,13,.72); padding:2px 7px; border-radius:4px;
    opacity:0; transition:.2s; pointer-events:none;
  }
  #dots button:hover .lb, #dots button.active .lb{ opacity:1; }

  /* ===== 開場：主標題在上、車在下，不重疊 ===== */
  #hero-overlay{
    position:fixed; top:6vh; left:0; right:0; z-index:20;
    text-align:center; pointer-events:none;
    transition:opacity .7s ease, transform .7s ease;
  }
  #hero-overlay.gone{ opacity:0; transform:translateY(-30px); }
  #hero-overlay .kick{ font-size:12px; letter-spacing:.24em; text-indent:.24em; color:var(--accent); margin-bottom:14px; }
  #hero-overlay h1{
    font-family:"Noto Serif TC",Georgia,serif; font-weight:300;
    font-size:clamp(34px, 5.6vw, 72px); letter-spacing:.03em; line-height:1.15;
  }
  #hero-overlay .sub{ font-size:clamp(15px, 1.5vw, 18px); color:#c2beb5; margin-top:14px; letter-spacing:.04em; }
  #hint{
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:20;
    color:var(--dim); font-size:13px; letter-spacing:.06em;
    text-align:center; transition:opacity .5s;
  }
  #hint .arrow{
    display:block; margin:10px auto 0; width:1px; height:30px;
    background:var(--accent); opacity:.6;
  }

  /* ===== 文字卡：桌面在側邊、手機在底部 ===== */
  #panel{
    position:fixed; z-index:10; top:50%; transform:translateY(-50%);
    left:6vw; width:min(420px, 38vw);
    padding:28px 30px 24px;
    border-radius:2px;
    background:rgba(12,12,13,.9);
    opacity:0; pointer-events:none;
    transition:opacity .5s ease;
    cursor:pointer;
  }
  #panel.show{ opacity:1; pointer-events:auto; }
  #panel.side-right{ left:auto; right:max(6vw, 88px); text-align:right; }  /* 至少讓出右側縮圖欄 */
  #panel .kicker{
    font-size:13px; letter-spacing:.04em; color:var(--accent); margin-bottom:14px;
  }
  #panel h2{
    font-family:"Noto Serif TC",Georgia,serif;
    font-size:clamp(24px, 3.6vw, 40px); font-weight:300; line-height:1.3; margin-bottom:10px;
  }
  #panel h2 em{ font-style:normal; font-weight:500; }
  #panel p{ font-size:clamp(15px, 1.2vw, 16px); line-height:1.9; color:#a29d93; }
  #panel .divider{ width:40px; height:1px; margin:16px 0; background:var(--accent); }
  #panel.side-right .divider{ margin-left:auto; }
  #panel .inner{ transition:opacity .35s ease; }
  #panel .inner.fading{ opacity:0; }

  .chips{ display:flex; flex-wrap:wrap; gap:7px; margin:12px 0 4px; }
  #panel.side-right .chips{ justify-content:flex-end; }
  /* 規格：車誌的資料框 */
  .specs{ border-top:1px solid rgba(236,233,226,.16); margin:4px 0 6px; text-align:left; }
  .specs div{ display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:8px 0; border-bottom:1px solid rgba(236,233,226,.16); }
  .specs dt{ font-size:14px; color:#a29d93; }
  .specs dd{ font-family:"Noto Serif TC",Georgia,serif; font-weight:500; font-size:17px; color:var(--text); }

  .cta{
    display:inline-block; margin-top:16px; text-decoration:none;
    font-size:15px; letter-spacing:.02em; color:#121008; font-weight:500;
    background:var(--accent); border-radius:2px; padding:13px 22px; transition:filter .2s;
  }
  .cta:hover{ filter:brightness(1.08); }
  .cta.ghost{
    color:var(--text); background:none; border-radius:0; padding:13px 2px 4px;
    border-bottom:1px solid rgba(255,255,255,.28); margin-left:22px;
  }
  .cta.ghost:hover{ border-bottom-color:var(--accent); filter:none; }

  /* 卡片輪播指示（3 條小槓）＋提示 */
  #card-dots{ display:flex; gap:6px; margin-top:18px; }
  #panel.side-right #card-dots{ justify-content:flex-end; }
  #card-dots i{
    width:22px; height:2px; background:rgba(255,255,255,.18); border-radius:2px; overflow:hidden; position:relative;
  }
  #card-dots i.done{ background:var(--accent); }
  #card-dots i.now::after{
    content:''; position:absolute; left:0; top:0; bottom:0; width:100%;
    background:var(--accent); transform-origin:left; transform:scaleX(var(--p,0));
  }
  #panel .tap-hint{ font:inherit; font-size:13px; color:#8d8a82; margin-top:6px; padding:4px 0; min-height:24px;
    background:none; border:none; cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
  #panel .tap-hint:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  /* ===== 結尾卡 ===== */
  #outro-panel{
    position:fixed; z-index:10; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(560px, 90vw); text-align:center;
    padding:38px 36px 30px;
    border-radius:2px;
    background:rgba(12,12,13,.9);
    opacity:0; pointer-events:none; transition:opacity .5s ease;
  }
  #outro-panel.show{ opacity:1; pointer-events:auto; }
  #outro-panel .kicker{ font-size:13px; letter-spacing:.04em; color:var(--accent); margin-bottom:14px; }
  #outro-panel h2{ font-family:"Noto Serif TC",Georgia,serif; font-size:clamp(26px,4vw,40px); font-weight:300; margin-bottom:10px; }
  #outro-panel h2 em{ font-style:normal; font-weight:500; }
  #outro-panel p{ font-size:15px; line-height:1.9; color:#a29d93; }
  #outro-panel .credits{ margin-top:22px; font-size:12px; line-height:2; color:#9a968d; letter-spacing:.02em; }
  #outro-panel .credits a{ color:#bdb8ad; }
  #outro-panel .src-link{ display:block; margin-top:14px; font-size:13px; color:#c9c5bc; letter-spacing:.04em; text-decoration:underline; text-underline-offset:3px; }

  /* ===== 載入畫面 ===== */
  #loader{
    position:fixed; inset:0; background:var(--bg); z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
    transition:opacity .9s ease;
  }
  #loader.done{ opacity:0; pointer-events:none; }
  #loader .badge{ font-size:13px; letter-spacing:.24em; text-indent:.24em; color:var(--accent); }
  #loader .bar-outer{ width:min(260px,60vw); height:1px; background:rgba(212,175,55,.18); }
  #loader .bar-inner{ width:100%; height:100%; transform:scaleX(0);
    background:var(--accent); transform-origin:left; transition:transform .25s ease; }
  #loader .pct{ font-size:13px; letter-spacing:.04em; color:var(--dim); }

  /* ===== Blender 城市電影開場 ===== */
  #cinematic-intro{
    position:fixed; inset:0; z-index:100; overflow:hidden; background:#000;
    color:#f5f2ea; transition:opacity .9s cubic-bezier(.4,0,.2,1);
  }
  #cinematic-intro.leaving{ opacity:0; pointer-events:none; }
  /* 開場還蓋著的時候，底下的介面整個藏起來：看不到的按鈕不該能被 Tab 到；淡出時再顯示，才有交叉淡入 */
  #cinematic-intro:not(.leaving) ~ *{ visibility:hidden; }
  #cinematic-intro video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    object-position:center center; background:#000;
  }
  #cinematic-intro::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(180deg,rgba(0,0,0,.42),transparent 20%);   /* 只壓暗頂端，讓「跳過開場」看得清楚；畫面其餘不蓋 */
  }
  /* 直式手機：16:9 的片子用 cover 會裁掉左右七成，特寫鏡頭的主體會不見 → 改成完整顯示、上下留黑 */
  @media (orientation:portrait){
    #cinematic-intro video{ object-fit:contain; }
  }
  .cinematic-intro__top,
  .cinematic-intro__bottom{
    position:absolute; z-index:2; left:clamp(20px,4vw,64px); right:clamp(20px,4vw,64px);
    display:flex; align-items:center; justify-content:space-between;
  }
  .cinematic-intro__top{ top:clamp(18px,4vh,46px); }
  .cinematic-intro__bottom{ bottom:clamp(22px,5vh,58px); align-items:flex-end; }
  .cinematic-intro__brand{
    font-size:12px; letter-spacing:.24em; text-indent:.24em; color:#f2d576;
    text-shadow:0 1px 10px rgba(0,0,0,.75);
  }
  .cinematic-intro__title small{
    display:block; margin-bottom:8px; color:#d4af37; font-size:10px;
    letter-spacing:.38em; text-transform:uppercase;
  }
  .cinematic-intro__title strong{
    display:block; font-family:"Noto Serif TC",Georgia,serif; font-weight:300;
    font-size:clamp(22px,3.2vw,42px); letter-spacing:.14em;
    text-shadow:0 4px 24px rgba(0,0,0,.8);
  }
  #intro-skip{
    border:none; border-radius:2px;
    background:rgba(8,8,9,.72); color:#fff; padding:0 14px; min-height:40px;
    font:400 14px/1 "Noto Sans TC",sans-serif; letter-spacing:.04em; cursor:pointer; transition:background .2s;
  }
  #intro-skip:hover{ background:rgba(8,8,9,.92); }   /* 影片亮處也要讀得到：實心深底，不用霧化 */
  #intro-play{
    position:absolute; z-index:3; left:50%; top:50%; transform:translate(-50%,-50%);
    display:none; border:none; border-radius:2px;
    background:#d4af37; color:#121008; padding:15px 26px;
    font:500 15px/1 "Noto Sans TC",sans-serif; letter-spacing:.04em; cursor:pointer;
  }
  #cinematic-intro.awaiting-play #intro-play{ display:block; }
  #cinematic-intro.buffering #intro-progress{ transform:scaleX(1); animation:introBuf 1.2s ease-in-out infinite alternate; }
  @keyframes introBuf{ from{ opacity:.12; } to{ opacity:.45; } }
  @media (prefers-reduced-motion:reduce){ #cinematic-intro.buffering #intro-progress{ animation:none; opacity:.3; } }
  .cinematic-intro__timeline{
    position:absolute; z-index:3; left:clamp(20px,4vw,64px); right:clamp(20px,4vw,64px);
    bottom:12px; height:1px; background:rgba(255,255,255,.18); overflow:hidden;
  }
  #intro-progress{
    display:block; width:100%; height:100%; transform:scaleX(0); transform-origin:left;
    background:#d4af37;
  }

  #fallback-msg{
    position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center;
    background:var(--bg); color:var(--dim); font-size:15px; line-height:2.2; text-align:center; padding:24px;
  }
  #fallback-msg b{ color:var(--accent); font-weight:400; }

  @media (max-width:680px){
    #topbar{ padding:12px 14px; }
    #topbar .brand b{ font-size:15px; }
    #topbar .tools{ gap:6px; }
    #topbar .tools > *{ min-width:40px; min-height:40px; justify-content:center; padding:0; }
    #topbar .tools .bt{ display:none; }   /* 手機按鈕只留圖示，三顆才擠得下 */
    #dots{ right:8px; gap:11px; }
    #dots button{
      width:8px; height:8px; border-radius:50%; border:none; opacity:1;
      background:rgba(255,255,255,.22); box-shadow:none; position:relative;
    }
    #dots button::after{ content:''; position:absolute; inset:-8px; }
    #dots button img, #dots button .ic{ display:none; }
    #dots button.active{ background:var(--accent); transform:scale(1.25); }
    #dots button .lb{ display:none; }
    #hero-overlay{ top:9vh; }
    .car-viewer canvas{ inset:auto; top:20vh; left:50%; width:118vw; height:auto; aspect-ratio:16/9; transform:translateX(-50%); object-fit:fill; }   /* 手機直式：圖框跟影格一樣大，邊緣遮罩才會淡掉 */
    #panel{
      top:auto; bottom:3.5vh; left:4vw; right:4vw; width:auto; transform:none;
      padding:18px 20px; max-height:44vh; overflow-y:auto;
    }
    #panel.side-right{ left:4vw; right:4vw; text-align:left; }
    #panel.side-right .divider{ margin-left:0; }
    #panel.side-right .chips, #panel.side-right #card-dots{ justify-content:flex-start; }
    .cta{ padding:12px 18px; font-size:14px; }
    .cta.ghost{ margin-left:16px; padding:12px 2px 4px; }
    #hint{ bottom:calc(3.5vh + 2px); display:none; }
  }
</style>
</head>
<body>

<section id="cinematic-intro" aria-label="開場影片：W202 停在 Dream Garage 門口的夜晚街道">
  <video id="intro-video" muted playsinline preload="none" poster="dream-garage-opening-poster.jpg"></video>
  <div class="cinematic-intro__top">
    <div class="cinematic-intro__brand">DREAM GARAGE</div>
    <button id="intro-skip" type="button" aria-label="跳過開場影片">跳過開場</button>
  </div>
  <button id="intro-play" type="button">播放開場</button>
  <div class="cinematic-intro__timeline"><span id="intro-progress"></span></div>
</section>

<script>
(function(){
  var intro=document.getElementById('cinematic-intro');
  var video=document.getElementById('intro-video');
  var progress=document.getElementById('intro-progress');
  var finished=false, started=false;

  /* 轉盤影格要等開場影片緩衝完（或開場結束）才開始下載，不然兩邊搶頻寬，影片會播一下停一下。
     實測 8 Mbps：一起下載時影片在 1.2 秒處停 2.3 秒。 */
  window.__dgIntroBusy = true;
  var quietCbs = window.__dgQuietCbs = [];
  function introQuiet(){
    window.__dgFonts();
    if(!window.__dgIntroBusy) return;
    window.__dgIntroBusy = false;
    for(var i=0;i<quietCbs.length;i++){ try{ quietCbs[i](); }catch(e){} }
  }
  function bufferedAll(){
    try{ var b=video.buffered; return !!(b.length && video.duration && b.end(b.length-1) >= video.duration-0.25); }catch(e){ return false; }
  }

  function prefetchEnv(){
    ['env-sunset.hdr','env-studio.hdr','env-night.hdr'].forEach(function(h){
      var l=document.createElement('link'); l.rel='prefetch'; l.href=h; document.head.appendChild(l);
    });
  }
  function leaveIntro(){
    if(finished) return;
    finished=true;
    try{ sessionStorage.setItem('dg_intro_seen','1'); }catch(e){}
    intro.classList.add('leaving');
    introQuiet();
    try{ window.dispatchEvent(new Event('dg-intro-left')); }catch(e){}
    try{ video.pause(); }catch(e){}
    setTimeout(function(){ intro.remove(); },950);
  }
  function startIntro(){
    started=true;
    intro.classList.remove('buffering');
    video.muted=true;
    var attempt=video.play();
    if(attempt&&attempt.then){
      attempt.then(function(){ intro.classList.remove('awaiting-play'); })
        .catch(function(){ intro.classList.add('awaiting-play'); });
    }
  }

  document.getElementById('intro-skip').addEventListener('click',leaveIntro);
  document.getElementById('intro-play').addEventListener('click',startIntro);
  video.addEventListener('ended',leaveIntro);
  video.addEventListener('error',leaveIntro);
  video.addEventListener('timeupdate',function(){
    var ratio=video.duration ? Math.min(video.currentTime/video.duration,1) : 0;
    progress.style.transform='scaleX('+ratio+')';
  });
  window.addEventListener('keydown',function(e){ if(e.key==='Escape') leaveIntro(); });
  var seen=false; try{ seen = sessionStorage.getItem('dg_intro_seen')==='1'; }catch(e){}
  if(seen){ finished=true; intro.remove(); introQuiet(); return; }

  /* 手機或慢網路給 720p（1.5 MB），其餘給 1080p（3.7 MB）。
     網速用海報圖（195 KB）的下載時間估：navigator.connection 只有 Chromium 有，而且不準。
     實測 3 Mbps 播 1080p 會停十幾次，播 720p 不會。 */
  var conn = navigator.connection || {};
  var small = (window.matchMedia && matchMedia('(max-width:680px)').matches) || !!conn.saveData || (conn.effectiveType && conn.effectiveType!=='4g');
  var POSTER = 'dream-garage-opening-poster.jpg';
  function posterMbps(){
    try{
      var e = performance.getEntriesByName(new URL(POSTER, location.href).href)[0];
      if(!e || !(e.encodedBodySize>50000)) return null;            // 從快取來的量不到，當作不知道
      var sec = (e.responseEnd - e.responseStart)/1000;
      return sec>0 ? e.encodedBodySize*8/sec/1e6 : null;
    }catch(err){ return null; }
  }

  /* 緩衝夠了才開播：畫面先停在海報，不要播一下停一下。等超過 8 秒就照播。
     不用瀏覽器的 canplaythrough：實測 3 Mbps 時它在只緩衝 1 秒的時候就說可以播，結果停了四次。
     自己量：每秒能緩衝幾秒的影片（r）。r ≥ 1 表示下載比播放快，存 1 秒就播；
     r < 1 就要先存到「播完之前不會追上」的量，也就是 片長 ×（1 − r），再留一點餘裕。
     iOS 不會在播放前預先下載，等也沒用，直接播。 */
  function begin(){ if(!started && !finished) startIntro(); }
  var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  function bufEnd(){ try{ var b=video.buffered; return b.length ? b.end(b.length-1) : 0; }catch(e){ return 0; } }
  var bufT0 = 0, buf0 = 0, bufLast = 0, bufLastT = 0;
  function enoughToPlay(){
    var d = video.duration, b = bufEnd();
    if(!d || !b) return false;
    if(b >= d-0.25) return true;
    var now = performance.now();
    /* 網路很快的時候，瀏覽器存夠了會自己停止下載（還沒播就不會抓完整支）。緩衝量半秒沒動、而且瀏覽器說資料夠了，就播 */
    if(b !== bufLast){ bufLast = b; bufLastT = now; }
    else if(video.readyState >= 4 && now-bufLastT >= 250) return true;
    if(!bufT0){ bufT0 = now; buf0 = b; return false; }
    var el = (now-bufT0)/1000;
    if(el < 0.6) return false;                                      // 至少看 0.6 秒才算得出速度
    var r = (b-buf0)/el;
    return b >= Math.max(1, d*(1-r)*1.15 + 0.5);
  }
  function checkBuf(){
    if(finished) return;
    if(!started && enoughToPlay()) begin();
    if(bufferedAll()) introQuiet();
  }
  video.addEventListener('progress', checkBuf);
  video.addEventListener('suspend', function(){ if(video.readyState >= 4) begin(); });   // 瀏覽器主動暫停下載 = 它認為夠了
  var bufTimer = setInterval(function(){ checkBuf(); if(finished || window.__dgIntroBusy===false) clearInterval(bufTimer); }, 250);
  video.addEventListener('timeupdate', function(){ if(bufferedAll() || (video.duration && video.currentTime>=video.duration-3)) introQuiet(); });
  var picked = false;
  function pick(slow){
    if(picked || finished) return;
    picked = true;
    var mbps = posterMbps();
    var use720 = small || slow || (mbps!==null && mbps<4);
    window.__dgNet = { mbps:mbps, use720:use720 };
    video.src = use720 ? 'dream-garage-opening-720.mp4' : 'dream-garage-opening.mp4';
    video.preload = 'auto';
    if(isIOS) startIntro();
    else setTimeout(begin, 8000);
  }
  intro.classList.add('buffering');
  if(small){ pick(false); }
  else {
    var probe = new Image();
    probe.onload = probe.onerror = function(){ pick(false); };
    probe.src = POSTER;
    setTimeout(function(){ pick(true); }, 1500);                    // 海報 1.5 秒還沒到：網路慢，給 720p
  }
  setTimeout(function(){ if(!started || video.paused) introQuiet(); }, 12000);   // 影片一直沒播起來（例如被擋自動播放）：放行
  setTimeout(introQuiet, 25000);                                    // 保險
})();

  b.innerHTML='<i class="ic"><svg class="lic" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" /><line x1="4" x2="4" y1="22" y2="15" /></svg></i><span class="lb">開始</span>';
  b.onclick=function(){ goTo(OUTRO); };
  dotsBox.appendChild(b);
})();
var dots = dotsBox.children;

/* ---------- 3 格輪替的轉盤池 ----------
   每台車 144 張影格（tt/<車>/000..143.webp），每張轉 2.5°；影格 0 是前 3/4。
   36 張（每 10°）的時候進場只換 4 張圖，看起來像每秒 5 格，所以加密到 144 張。
   分層下載，先載會用到的：
     0 停留的那一張　1 進場掃過的 60°（24 張）　2 每 10° 一張　3 每 5° 一張　4 剩下的
   前後一台只載 0、1 層（夠它順順地進場），輪到它才補 2、3 層。第 4 層（約 1.3 MB）等使用者真的動手拖了才載，
   沒拖過的人不用多付這些流量。畫的時候挑離目標角度最近、已經載好的那張。 */
var SLOT_N = 3, FR = 144, ARC = 24;            // ARC：進場掃過的格數（24 × 2.5° = 60°）
var TT_VER = '144f';                           // 影格重渲染時改這個，讓瀏覽器重抓
var viewerBox = document.getElementById('viewers');
var slots = [];
var _conn = navigator.connection || {};
var LITE = !!_conn.saveData || /(^|-)2g$|^3g$/.test(_conn.effectiveType||'');   // 省流量或慢網路：拖曳也只載到每 5° 一張
function fmod(i){ return ((i%FR)+FR)%FR; }
function frameURL(k, i){ return 'tt/'+CARS[k].file.replace(/\.glb$/i,'')+'/'+String(fmod(i)).padStart(3,'0')+'.webp?v='+TT_VER; }
/* 停留角度：車頭朝文字卡的反方向。偶數台文字卡在左 → 70°（車頭朝右）；奇數台文字卡在右 → 0°（車頭朝左） */
function baseFrame(k){ return (k%2===0) ? 28 : 0; }
function sweepDir(k){ return (k%2===0) ? 1 : -1; }
(function(){
  for(var s=0;s<SLOT_N;s++){
    var el = document.createElement('div'); el.className='car-viewer'; el.setAttribute('aria-hidden','true');
    var cv = document.createElement('canvas'); cv.width=1280; cv.height=720;
    el.appendChild(cv); viewerBox.appendChild(el);
    slots.push({ el:el, ctx:cv.getContext('2d',{alpha:false}), car:-1, imgs:[], ok:null, req:null, need:0, got:0, loaded:false, readyAt:0, ia:-1, full:false });
  }
})();
function slotFor(k){ return slots[((k%SLOT_N)+SLOT_N)%SLOT_N]; }

/* 下載佇列：一次最多 10 張；開場影片還在緩衝時一張都不載 */
var Q = [], inflight = 0, loadGo = false;
function enqueue(s, list, tier){
  for(var j=0;j<list.length;j++){
    var i = fmod(list[j]);
    if(s.req[i]) continue;
    s.req[i] = 1;
    if(tier<=1) s.need++;
    Q.push({ s:s, car:s.car, i:i, tier:tier });
  }
}
function taskPri(t, cur){ return t.tier + (t.car===cur ? 0 : 1.5); }   // 現在這台優先；鄰車的 0、1 層排在現在這台的 10° 層前後
function pump(){
  if(!loadGo || window.__dgIntroBusy) return;
  var maxc = 10;
  while(inflight<maxc && Q.length){
    var cur = (step>=N) ? N-1 : step, bi = -1, bp = 1e9;
    for(var j=Q.length-1;j>=0;j--){ if(Q[j].s.car!==Q[j].car) Q.splice(j,1); }   // 那一格已經換車，不用載了
    for(var j2=0;j2<Q.length;j2++){ var p = taskPri(Q[j2], cur); if(p<bp){ bp = p; bi = j2; } }
    if(bi<0) break;
    loadOne(Q.splice(bi,1)[0]);
  }
}
function loadOne(t){
  inflight++;
  var s = t.s, im = new Image();
  im.decoding = 'async';
  im.onload = im.onerror = function(ev){
    inflight--;
    if(s.car===t.car){
      if(ev.type==='load'){
        s.imgs[t.i] = im; s.ok[t.i] = 1;
        if(t.tier<=1 && im.decode) im.decode().catch(function(){});   // 進場會用到的先解碼好，轉的時候才不會頓
      }
      if(t.tier<=1){
        s.got++;
        if(t.car===0 && s===slots[0] && !s.loaded) setLoadPct(s.got/s.need);
        if(s.got>=s.need && !s.loaded){ s.loaded = true; s.readyAt = performance.now(); }
      }
    }
    pump();
  };
  im.src = frameURL(t.car, t.i);
}
function assignSlot(k){
  if(k<0||k>=N) return;
  var s = slotFor(k);
  if(s.car===k) return;
  s.car = k; s.loaded = false; s.full = false; s.fine = false; s.need = 0; s.got = 0; s.ia = -1; s.readyAt = 0;
  s.imgs = new Array(FR); s.ok = new Uint8Array(FR); s.req = new Uint8Array(FR);
  s.el.style.opacity = 0;
  var b = baseFrame(k), d = sweepDir(k), arc = [];
  for(var j=1;j<=ARC;j++) arc.push(b - d*j);
  enqueue(s, [b], 0);
  enqueue(s, arc, 1);
  pump();
}
/* 輪到這台當主角：把整圈補齊（拖曳旋轉用） */
function loadFull(k){
  if(k<0||k>=N) return;
  var s = slotFor(k);
  if(s.car!==k || s.full) return;
  s.full = true;
  var t2=[], t3=[];
  for(var i=0;i<FR;i++){ if(i%4===0) t2.push(i); else if(i%2===0) t3.push(i); }
  enqueue(s, t2, 2); enqueue(s, t3, 3);
  pump();
  if(dragged) loadFine(k);
}
/* 使用者拖過車：這台（以及之後看的每一台）補到每 2.5° 一張 */
var dragged = false;
function loadFine(k){
  if(LITE || k<0 || k>=N) return;
  var s = slotFor(k);
  if(s.car!==k || s.fine) return;
  s.fine = true;
  var t4=[];
  for(var i=1;i<FR;i+=2) t4.push(i);
  enqueue(s, t4, 4);
  pump();
}
function nearestLoaded(s, i){
  if(s.ok[i]) return i;
  for(var d=1; d<=FR/2; d++){
    var a = fmod(i+d), b = fmod(i-d);
    if(s.ok[a]) return a;
    if(s.ok[b]) return b;
  }
  return -1;
}
function showFrame(s, i){
  var j = nearestLoaded(s, fmod(i));
  if(j<0 || j===s.ia) return;
  s.ctx.drawImage(s.imgs[j], 0, 0, 1280, 720);
  s.ia = j; s.el.dataset.f = j;
}
/* 拖曳旋轉（滑鼠或觸控水平拖）：放開後車停在新的角度，自動環繞從那裡接著轉 */
var userRot = 0, _dragX = null, _dragRot = 0;
window.addEventListener('pointerdown', function(e){
  if(e.target.closest && e.target.closest('#panel, #topbar, #dots, #outro-panel, #cinematic-intro, a, button')) return;
  if(step>=N || heroActive) return;
  _dragX = e.clientX; _dragRot = userRot; document.body.classList.add('dragging');
  if(!dragged){ dragged = true; } loadFine(step);
});
window.addEventListener('pointermove', function(e){ if(_dragX!==null) userRot = _dragRot - (e.clientX - _dragX) / 6; });   // 每拖 6px 轉一格（2.5°），跟原本每 24px 轉 10° 一樣快
window.addEventListener('pointerup', function(){ _dragX = null; document.body.classList.remove('dragging'); });
window.addEventListener('pointercancel', function(){ _dragX = null; document.body.classList.remove('dragging'); });
/* 上漆（sRGB → linear） */
function s2l(c){ c/=255; return c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); }
function paintCar(mv, car){
  try{
    var hex = car.paint.replace('#','');
    var col = [ s2l(parseInt(hex.substr(0,2),16)), s2l(parseInt(hex.substr(2,2),16)), s2l(parseInt(hex.substr(4,2),16)), 1 ];
    mv.model.materials.forEach(function(m){
      var n = m.name||'';
      var hit = (car.body instanceof RegExp) ? car.body.test(n) : n===car.body;
      if(hit){
        m.pbrMetallicRoughness.setBaseColorFactor(col);
        m.pbrMetallicRoughness.setMetallicFactor(0.6);
        m.pbrMetallicRoughness.setRoughnessFactor(0.38);
      }
      if(car.plateMats && car.plateMats.indexOf(n)>=0){   // 模型內建車牌字樣（模型商名稱）→ 壓成空白深色牌
        m.pbrMetallicRoughness.setBaseColorFactor([0.05,0.055,0.06,1]);
        m.pbrMetallicRoughness.setMetallicFactor(0.3);
        m.pbrMetallicRoughness.setRoughnessFactor(0.5);
      }
    });
  }catch(e){}
}

/* ---------- 狀態 ---------- */
var step = 0;              // 0..N-1 = 車；N = 結尾
var prevStep = -1;         // 換站時的上一站（做離場動畫）
var stepT = 0;             // 到站後經過的秒數
var transT = 999;          // 換站以來經過的秒數（>FLY_SEC 表示轉場結束）
var heroActive = true;     // 開場標題還在
var cardIdx = 0;           // 文字卡 0..2
var cardT = 0;             // 這張卡顯示了幾秒
var autoPlay = false;      // 自動導覽
var lastNav = 0;

function clamp(v,a,b){ return v<a?a : v>b?b : v; }
function easeOut(t){ t=clamp(t,0,1); return 1-Math.pow(1-t,3); }
function isMobile(){ return window.innerWidth<=680; }

/* ---------- 每站的運鏡：飛入 → 慢速環繞 ---------- */
function camFor(i, t){
  var dir = (i%2===0)? 1 : -1;
  var base = -30*dir;
  var e = easeOut(t/FLY_SEC);
  var th, ph, r;
  if(t < FLY_SEC){
    th = base - dir*70*(1-e);          // 從側後方掃進來
    ph = 66 + 10*e;
    r  = 210 - 90*e;                   // 從遠處推近
  } else {
    var u = t - FLY_SEC;
    th = base - dir*9*u;               // 慢速環繞（約 40 秒一圈）
    ph = 76 + 5*Math.sin(u*0.22);      // 呼吸般的高低起伏
    r  = 120 + 6*Math.sin(u*0.15);
  }
  return { th:th, ph:ph, r:r };
}

/* ---------- 文字卡內容 ---------- */
function cardHTML(i, c){
  var st=STORIES[i], sp=SPECS[i], car=CARS[i];
  if(c===0) return '<div class="kicker">'+st.kick+'</div><h2>'+st.title+'</h2><div class="divider"></div><p>'+car.name+'。'+st.tag+'。</p>';
  if(c===1) return '<div class="kicker">故事</div><p>'+st.story+'</p><p style="margin-top:8px">'+st.story2+'</p>';
  var rows = sp.map(function(kv){ return '<div><dt>'+kv[0]+'</dt><dd>'+kv[1]+'</dd></div>'; }).join('');
  return '<div class="kicker">規格</div><dl class="specs">'+rows+'</dl><a class="cta" href="garage.html?car='+(car.id||car.file.replace(/\.glb$/i,''))+'">配這一台 →</a>';
}
var panel = document.getElementById('panel');
var panelInner = document.getElementById('panel-inner');
function showCard(i, c, instant){
  cardIdx = c; cardT = 0;
  if(instant){
    panelInner.innerHTML = cardHTML(i, c);
    return;
  }
  panelInner.classList.add('fading');
  setTimeout(function(){
    panelInner.innerHTML = cardHTML(i, c);
    panelInner.classList.remove('fading');
  }, 300);
}
panel.addEventListener('click', function(e){
  if(e.target.closest('a')) return;                 // CTA 連結不攔
  if(step<N) showCard(step, (cardIdx+1)%3);
});
function updateCardDots(){
  var bars = document.getElementById('card-dots').children;
  for(var b=0;b<3;b++){
    bars[b].className = b<cardIdx ? 'done' : (b===cardIdx ? 'now' : '');
    if(b===cardIdx) bars[b].style.setProperty('--p', clamp(cardT/CARD_SEC,0,1));
  }
}

/* Lucide icon 字串（給會動態改字的按鈕用） */
var LIC = {
  vol2:'<svg class="lic" viewBox="0 0 24 24"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" /><path d="M16 9a5 5 0 0 1 0 6" /><path d="M19.364 18.364a9 9 0 0 0 0-12.728" /></svg>',
  volx:'<svg class="lic" viewBox="0 0 24 24"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" /><line x1="22" x2="16" y1="9" y2="15" /><line x1="16" x2="22" y1="9" y2="15" /></svg>',
  play:'<svg class="lic" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" /></svg>',
  pause:'<svg class="lic" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1" /><rect x="6" y="4" width="4" height="16" rx="1" /></svg>'
};

/* ---------- 引擎聲：換車那一刻播一聲（預設關，記住偏好） ---------- */
var sndOn = false;
try{ sndOn = localStorage.getItem('dg_snd')==='1'; }catch(e){}
var _eng = null;
var sndBtn = document.getElementById('btn-snd');
function drawSndBtn(){
  sndBtn.innerHTML = (sndOn?LIC.vol2:LIC.volx)+'<span class="bt"> 引擎聲</span>';
  sndBtn.classList.toggle('on', sndOn);
}
drawSndBtn();
function stopEngine(){ if(_eng){ try{ _eng.pause(); }catch(e){} _eng=null; } }
function playEngine(i){
  if(!sndOn || i<0 || i>=N) return;
  stopEngine();
  var a = new Audio('snd-'+CARS[i].file.replace(/\.glb$/i,'.mp3'));
  a.volume = 0.75;
  _eng = a;
  var p = a.play();
  if(p && p.catch) p.catch(function(){});   // 沒有錄音檔（Mustang）或瀏覽器擋自動播放：靜默略過
}
sndBtn.onclick = function(){
  sndOn = !sndOn;
  try{ localStorage.setItem('dg_snd', sndOn?'1':'0'); }catch(e){}
  drawSndBtn();
  if(sndOn && !heroActive && step<N) playEngine(step);
  else stopEngine();
};

/* ---------- 收開場標題（滾輪/觸控/鍵盤/按鈕共用） ---------- */
function dismissHero(){
  heroActive = false;
  document.getElementById('hero-overlay').classList.add('gone');
  document.getElementById('hint').style.opacity = 0;
}

/* ---------- 站點切換 ---------- */
function applyTheme(i){
  var c = CARS[clamp(i,0,N-1)];
  document.documentElement.style.setProperty('--accent', c.accent);
  var h=c.accent.replace('#','');
  var stage = document.getElementById('stage');
  stage.style.setProperty('--glow',
    'rgba('+parseInt(h.substr(0,2),16)+','+parseInt(h.substr(2,2),16)+','+parseInt(h.substr(4,2),16)+',0.13)');
  stage.style.setProperty('--stage-mid', (ENVS[c.env]||ENVS.studio).tint);   // 舞台底色跟著環境走
  for(var d=0; d<dots.length; d++) dots[d].classList.toggle('active', d===i);
}
var prevT = 0;   // 上一站離場時的環繞秒數（讓離場的車維持原姿態，不跳角度）
function goTo(n){
  n = clamp(n, 0, OUTRO);
  if(n===step) return;
  prevStep = step;
  prevT = stepT;
  step = n;
  stepT = 0; transT = 0; userRot = 0;
  lastNav = performance.now();
  if(heroActive) dismissHero();
  applyTheme(step);
  document.getElementById('progress-bar').style.transform = 'scaleX('+(step/OUTRO)+')';
  panel.classList.remove('show');
  var outro = document.getElementById('outro-panel');
  if(step===OUTRO){
    outro.classList.add('show');
    assignSlot(N-1); pump();    // 結尾卡背後放最後一台車當背景
    stopEngine();
  } else {
    outro.classList.remove('show');
    panel.classList.toggle('side-right', step%2===1);
    showCard(step, 0, true);
    assignSlot(step); assignSlot(step+1); assignSlot(step-1); loadFull(step);
    playEngine(step);           // 引擎聲跟著鏡頭飛入一起來
  }
}

/* ---------- 主迴圈（時間驅動，不靠捲動） ---------- */
var lastTick = 0;
function tick(now){
  var dt = lastTick ? Math.min((now-lastTick)/1000, 0.1) : 0.016;
  lastTick = now;
  stepT += dt; transT += dt;
  var showCar = (step===OUTRO) ? N-1 : step;   // 結尾卡背後留最後一台車

  /* 文字卡自動輪播 + 自動導覽 */
  if(step<N && !heroActive && transT>FLY_SEC){
    cardT += dt;
    if(cardT >= CARD_SEC){
      if(cardIdx<2) showCard(step, cardIdx+1);
      else if(autoPlay) { goTo(step+1); }
      else { cardT = 0; cardIdx = 0; showCard(step, 0); }
    }
    if(!panel.classList.contains('show')) panel.classList.add('show');
    updateCardDots();
  }
  if(step===OUTRO && autoPlay && stepT>10) goTo(0);   // 自動導覽看完結尾回到第一台

  /* 每個格子的透明度與鏡頭 */
  for(var s=0;s<SLOT_N;s++){
    var slot = slots[s];
    if(slot.car<0){ slot.el.style.opacity=0; continue; }
    if(!slot.loaded){ slot.el.style.opacity=0; continue; }

    var op=0, frame=null, sc=1;
    if(slot.car===showCar){
      var e = easeOut(transT/FLY_SEC);
      var r = clamp(transT/ROT_SEC, 0, 1);
      var sweep = Math.round((1-r)*(1-r)*ARC);                          // 到站：掃 60° 進定位。等減速，收尾只剩兩三格慢的
      frame = baseFrame(slot.car) - sweep*sweepDir(slot.car) + Math.round(userRot);
      sc = (isMobile() ? 0.9 + 0.1*e : 0.74 + 0.08*e) + Math.min(stepT, 30)*0.001;   // 推近，停留時再極慢推近；桌面縮小讓出文字卡
      op = (transT<FLY_SEC) ? e : 1;
      op = Math.min(op, (now-slot.readyAt)/400);                        // 圖比換車晚到：淡入，不要突然跳出來
      if(step===OUTRO){ op = 0.3; sc = isMobile() ? 0.92 : 0.7; }       // 結尾：拉遠變背景
    } else if(slot.car===prevStep && prevStep<N && transT<FLY_SEC*0.7){
      var eo = transT/(FLY_SEC*0.7);
      frame = slot.ia<0 ? null : slot.ia;                               // 離場：維持原角度，縮小淡出
      sc = 1 - 0.1*eo;
      op = 1-easeOut(eo);
    }
    if(frame!==null){
      var xs = (isMobile()||heroActive) ? 0 : (slot.car%2===0 ? 7 : -7);   // 桌面：車閃開文字卡；手機/開場置中
      var ys = heroActive ? 6 : (isMobile() ? 2 : 0);                       // 開場車往下讓標題；手機車放在頂欄與底卡之間
      slot.el.style.opacity = op.toFixed(3);
      slot.el.style.transform = 'translate('+xs+'vw,'+ys+'vh) scale('+sc.toFixed(4)+')';
      showFrame(slot, frame);
    } else {
      slot.el.style.opacity = 0;
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
/* 保險絲：rAF 被節流（背景分頁/嵌入面板）時用計時器補幀 */
setInterval(function(){
  if(performance.now()-lastTick>250) tick(performance.now());
}, 150);

/* ---------- 輸入：滾輪 / 觸控 / 鍵盤 = 一次一站 ---------- */
function navBy(d){
  var now = performance.now();
  if(now-lastNav < 900) return;   // 冷卻，避免觸控板慣性連跳
  goTo(step + d);
}
window.addEventListener('wheel', function(e){
  if(Math.abs(e.deltaY)<20) return;
  if(heroActive){                       // 開場第一滾：收標題留在第一台
    var now=performance.now();
    if(now-lastNav<900) return;
    lastNav=now;
    dismissHero();
    transT = FLY_SEC+0.01;              // 已經在看第一台了，直接開卡
    playEngine(step);
    return;
  }
  navBy(e.deltaY>0 ? 1 : -1);
}, {passive:true});
var _tY=null;
window.addEventListener('touchstart', function(e){ _tY = e.touches[0].clientY; }, {passive:true});
window.addEventListener('touchend', function(e){
  if(_tY===null) return;
  var dy = _tY - e.changedTouches[0].clientY;
  _tY = null;
  if(Math.abs(dy)<45) return;
  if(heroActive){
    dismissHero();
    transT = FLY_SEC+0.01;
    playEngine(step);
    return;
  }
  navBy(dy>0 ? 1 : -1);
}, {passive:true});
window.addEventListener('keydown', function(e){
  if(e.key===' ' && e.target && e.target.closest && e.target.closest('button, a, input, select, textarea')) return;   // 焦點在按鈕上：空白鍵是按那顆按鈕
  if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' ') { e.preventDefault(); heroActive? (function(){dismissHero();transT=FLY_SEC+0.01;playEngine(step);})() : navBy(1); }
  if(e.key==='ArrowUp'||e.key==='PageUp') { e.preventDefault(); navBy(-1); }
});

/* ---------- 自動導覽 ---------- */
var autoBtn = document.getElementById('btn-auto');
autoBtn.onclick = function(){
  autoPlay = !autoPlay;
  autoBtn.classList.toggle('on', autoPlay);
  autoBtn.innerHTML = (autoPlay?LIC.pause:LIC.play)+'<span class="bt"> 自動導覽'+(autoPlay?'中':'')+'</span>';
  if(autoPlay && heroActive){
    dismissHero();
    transT = FLY_SEC+0.01;
    playEngine(step);
  }
};
document.getElementById('btn-restart').onclick = function(e){ e.preventDefault(); goTo(0); };

/* ---------- 初始化 ---------- */
applyTheme(0);
showCard(0, 0, true);   // 預先放好第一台的介紹卡（開場收掉後立刻能用）
assignSlot(0); assignSlot(1); loadFull(0);
loadGo = true; pump();
if(window.__dgIntroBusy) window.__dgQuietCbs.push(pump);   // 開場影片緩衝完或結束才開始載
/* 開場影片淡出時，第一台車重新轉進來一次（它在影片後面早就到位了，不重播的話看不到進場） */
window.addEventListener('dg-intro-left', function(){
  setTimeout(function(){ if(step===0 && heroActive && slots[0].loaded){ stepT = 0; transT = 0; } }, 300);
});
function setLoadPct(p){
  var pct = Math.round(p*100);
  document.getElementById('load-bar').style.transform = 'scaleX('+(pct/100)+')';
  document.getElementById('load-pct').textContent = '載入車庫 '+pct+'%';
}
var waited=0;
var poll=setInterval(function(){
  waited+=300;
  if(slots[0].loaded){
    clearInterval(poll);
    document.getElementById('load-bar').style.transform='scaleX(1)';
    loader.classList.add('done');
    stepT = 0; transT = 0;      // 開場：第一台做飛入
  } else if(waited>=45000){
    clearInterval(poll);
    loader.classList.add('done'); fallback.style.display='flex';
  }
},300);
})();
</script>
</body>
</html>
